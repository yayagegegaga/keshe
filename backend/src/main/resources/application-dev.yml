spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/stray_animal?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}

jwt:
  secret: ${JWT_SECRET:stray-animal-platform-jwt-secret-for-dev-only-please-change}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}
  access-prefix: ${FILE_ACCESS_PREFIX:/uploads}
  max-size: ${FILE_MAX_SIZE:10485760}
